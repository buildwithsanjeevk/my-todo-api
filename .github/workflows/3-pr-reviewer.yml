name: 4. AI PR Code Reviewer

run-name: 🔍 AI PR Review — PR #${{ github.event.inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to review (e.g., 21)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run AI Code Review & Apply Verdict Label
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re, json, glob, time, subprocess, urllib.request, urllib.error

          api_key = os.environ["NVIDIA_API_KEY"].strip()
          pr_num = os.environ["PR_NUMBER"]
          repo_name = os.environ["REPO_NAME"]

          def run_cmd(cmd):
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  raise RuntimeError(f"Command failed: {' '.join(cmd)}\n{res.stderr}")
              return res.stdout

          def ensure_label(repo, name, color, description):
              create_res = subprocess.run(
                  [
                      "gh", "api", f"repos/{repo}/labels",
                      "-f", f"name={name}",
                      "-f", f"color={color}",
                      "-f", f"description={description}"
                  ],
                  capture_output=True, text=True
              )
              if create_res.returncode != 0:
                  subprocess.run(
                      [
                          "gh", "api", "-X", "PATCH", f"repos/{repo}/labels/{name}",
                          "-f", f"color={color}",
                          "-f", f"description={description}"
                      ],
                      capture_output=True, text=True
                  )

          # 1. Fetch fast, active chat/instruct models available on NVIDIA NIM
          def get_candidate_models(key):
              req = urllib.request.Request(
                  "https://integrate.api.nvidia.com/v1/models",
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Accept": "application/json",
                      "User-Agent": "GitHub-Actions-AI-Reviewer/1.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  models = json.loads(resp.read().decode("utf-8")).get("data", [])

              available_ids = [m["id"] for m in models if m.get("id")]

              excluded = (
                  "starcoder", "codegemma", "embed", "rerank", "guard", "safeguard",
                  "reward", "parse", "ocr", "vlm", "vision", "clip", "deplot",
                  "kosmos", "neva", "paligemma", "whisper", "tts", "asr", "riva",
                  "canary", "parakeet", "vila", "stable-diffusion", "flux", "sdxl",
                  "cosyvoice", "bge-", "safety", "shield", "omni", "4-1t", "550b", "ultra"
              )

              priority_keywords = [
                  "qwen/qwen2.5-coder-32b-instruct",
                  "meta/llama-3.3-70b-instruct",
                  "nvidia/llama-3.3-nemotron-super-49b",
                  "nvidia/llama-3.1-nemotron-70b-instruct",
                  "qwen/qwen2.5-72b-instruct",
                  "mistralai/mistral-large-2-instruct",
                  "qwen2.5-coder",
                  "llama-3.3-70b",
                  "nemotron-3.5-bolt",
                  "nemotron",
                  "qwen/qwen3",
                  "deepseek",
              ]

              ordered = []
              for kw in priority_keywords:
                  for mid in available_ids:
                      low = mid.lower()
                      if kw in low and not any(x in low for x in excluded) and mid not in ordered:
                          ordered.append(mid)

              for mid in available_ids:
                  low = mid.lower()
                  if any(tag in low for tag in ("instruct", "chat")) and not any(x in low for x in excluded):
                      if mid not in ordered:
                          ordered.append(mid)

              return ordered

          # 2. Fetch PR metadata and diff
          pr_json = json.loads(run_cmd([
              "gh", "pr", "view", pr_num,
              "--json", "title,body,url,headRefName,baseRefName,files,closingIssuesReferences"
          ]))
          pr_diff = run_cmd(["gh", "pr", "diff", pr_num])

          gh_env = os.environ.get("GITHUB_ENV")
          if gh_env:
              safe_title = pr_json.get("title", "").replace("\n", " ").strip()
              with open(gh_env, "a", encoding="utf-8") as ef:
                  ef.write(f"PR_URL={pr_json.get('url', '')}\n")
                  ef.write(f"PR_TITLE={safe_title}\n")

          # 3. Fetch full details of linked issues safely
          linked_issue_blocks = []
          for ref in pr_json.get("closingIssuesReferences", []):
              inum = str(ref.get("number", ""))
              if inum:
                  ires = subprocess.run(
                      ["gh", "issue", "view", inum, "--json", "number,title,body"],
                      capture_output=True, text=True
                  )
                  if ires.returncode == 0:
                      idata = json.loads(ires.stdout)
                      linked_issue_blocks.append(
                          f"- Issue #{idata.get('number')}: {idata.get('title', '')}\n{idata.get('body', '')}"
                      )
          linked_issues = "\n\n".join(linked_issue_blocks) or "None linked."

          # 4. Load repository .skills/ standards
          skills_text = []
          for path in sorted(glob.glob(".skills/**/SKILL.md", recursive=True)):
              if os.path.isfile(path):
                  with open(path, "r", encoding="utf-8") as f:
                      skills_text.append(f"=== {path} ===\n{f.read()}")
          skills_context = "\n\n".join(skills_text) or "No custom SKILL.md files found."

          # 5. Read full content of changed files from PR branch for complete context
          head_ref = pr_json["headRefName"]
          run_cmd(["git", "fetch", "origin", head_ref])
          changed_files_content = []
          for f_info in pr_json.get("files", []):
              fpath = f_info["path"]
              show_res = subprocess.run(
                  ["git", "show", f"origin/{head_ref}:{fpath}"],
                  capture_output=True, text=True
              )
              if show_res.returncode == 0:
                  changed_files_content.append(f"=== FULL FILE ({fpath}) ===\n{show_res.stdout[:8000]}")

          system_prompt = """You are reviewing a Pull Request for correctness and minimal scope.
          Check the linked issue, PR diff, changed files, and `.skills/` rules for missing requirements,
          bugs, syntax/security errors, accidental deletion, or unrelated changes.

          Respond ONLY with valid JSON using this exact schema (no markdown fences, no extra text):
          {
            "status": "APPROVED" or "CHANGES_REQUESTED",
            "summary": "2-3 sentence clear summary of your review findings.",
            "checklist": [
              "Short bullet confirming what was checked (e.g., Requirements & edge cases verified)"
            ],
            "suggestions": [
              {
                "file": "filename",
                "issue": "Clear description of the bug, missing requirement, or violation",
                "recommendation": "Exact fix or improvement needed"
              }
            ]
          }

          Rules:
          - Use "APPROVED" ONLY when the code is clean, complete, preserves existing functionality, and has zero blocking issues (leave "suggestions" as an empty list []).
          - Use "CHANGES_REQUESTED" if any requirement is missing, existing working code was removed, error handling is wrong, or there is a bug."""

          user_prompt = f"""PR #{pr_num}: {pr_json['title']}
          PR Body:
          {pr_json.get('body', '')}

          Linked Issue Requirements:
          {linked_issues}

          Repository Agent Skills:
          {skills_context[:6000]}

          Git Diff:
          {pr_diff[:18000]}

          Full Changed Files (for context):
          {chr(10).join(changed_files_content)[:18000]}
          """

          candidates = get_candidate_models(api_key)
          if not candidates:
              raise RuntimeError("No active chat models available on this NVIDIA NIM API key.")

          review = None
          last_error = ""

          for model_id in candidates[:8]:
              print(f"Reviewing PR with NVIDIA NIM model: {model_id}")
              payload = json.dumps({
                  "model": model_id,
                  "temperature": 0.1,
                  "max_tokens": 2000,
                  "messages": [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": user_prompt}
                  ]
              }).encode("utf-8")

              try:
                  req = urllib.request.Request(
                      "https://integrate.api.nvidia.com/v1/chat/completions",
                      data=payload,
                      headers={
                          "Authorization": f"Bearer {api_key}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "GitHub-Actions-AI-Reviewer/1.0"
                      }
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      content = data["choices"][0]["message"].get("content") or ""
                      raw_reply = re.sub(r"<think>.*?</think>", "", content, flags=re.DOTALL).strip()

                      start_idx = raw_reply.find("{")
                      end_idx = raw_reply.rfind("}")
                      if start_idx == -1 or end_idx == -1:
                          last_error = f"Model `{model_id}` did not return valid JSON"
                          continue

                      review = json.loads(raw_reply[start_idx:end_idx + 1])
                      break
              except urllib.error.HTTPError as e:
                  err_detail = e.read().decode("utf-8", errors="ignore")
                  last_error = f"NVIDIA NIM API error ({e.code}) on `{model_id}`: {err_detail}"
                  if e.code not in (402, 403, 404):
                      time.sleep(1)
              except Exception as e:
                  last_error = f"Request error on `{model_id}`: {e}"
                  time.sleep(1)

          if not review:
              raise RuntimeError(f"NVIDIA NIM review failed: {last_error}")

          status = review.get("status", "CHANGES_REQUESTED").upper()
          summary = review.get("summary", "")
          checklist = review.get("checklist", [])
          suggestions = review.get("suggestions", [])

          final_verdict = "APPROVED" if (status == "APPROVED" and not suggestions) else "CHANGES_REQUESTED"
          if gh_env:
              with open(gh_env, "a", encoding="utf-8") as ef:
                  ef.write(f"REVIEW_VERDICT={final_verdict}\n")

          ensure_label(repo_name, "approved", "0E8A16", "AI Code Review Passed")
          ensure_label(repo_name, "changes-requested", "D93F0B", "AI Code Review Suggested Changes")

          checklist_md = "\n".join(f"- ✅ {item}" for item in checklist)

          if final_verdict == "APPROVED":
              subprocess.run(["gh", "pr", "edit", pr_num, "--add-label", "approved"], check=False)
              subprocess.run(["gh", "pr", "edit", pr_num, "--remove-label", "changes-requested"], check=False)
              comment_body = (
                  f"## 🟢 AI Code Review: Approved\n\n"
                  f"{summary}\n\n"
                  f"### Verification Checklist\n"
                  f"{checklist_md}\n\n"
                  f"---\n"
                  f"🏷️ Label **`approved`** has been added. Ready for your final merge decision!"
              )
          else:
              subprocess.run(["gh", "pr", "edit", pr_num, "--add-label", "changes-requested"], check=False)
              subprocess.run(["gh", "pr", "edit", pr_num, "--remove-label", "approved"], check=False)
              suggestions_md = "\n\n".join(
                  f"#### 📄 `{s.get('file', 'General')}`\n"
                  f"- **Issue:** {s.get('issue', '')}\n"
                  f"- **Suggested Fix:** {s.get('recommendation', '')}"
                  for s in suggestions
              )
              comment_body = (
                  f"## 🟠 AI Code Review: Changes Suggested\n\n"
                  f"{summary}\n\n"
                  f"### Suggested Improvements\n"
                  f"{suggestions_md}\n\n"
                  f"---\n"
                  f"🏷️ Label **`changes-requested`** has been added.\n"
                  f"👉 **Your Next Step:** Reply with **`Please apply the suggested AI review changes`** to have the AI fix these automatically, or merge/close as you prefer."
              )

          with open("/tmp/pr_review_comment.md", "w", encoding="utf-8") as f:
              f.write(comment_body)

          run_cmd(["gh", "pr", "comment", pr_num, "--body-file", "/tmp/pr_review_comment.md"])
          EOF

      - name: Send Slack Status Alert
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REVIEW_VERDICT: ${{ env.REVIEW_VERDICT }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || 'N/A' }}
          PR_TITLE: ${{ env.PR_TITLE }}
          PR_URL: ${{ env.PR_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set. Skipping Slack notification."
            exit 0
          fi

          python3 - << 'EOF'
          import os, json, urllib.request

          webhook_url = os.environ["SLACK_WEBHOOK_URL"].strip()
          status = os.environ["JOB_STATUS"]
          verdict = os.environ.get("REVIEW_VERDICT", "").strip()
          repo = os.environ["REPO_NAME"]
          wf = os.environ["WORKFLOW_NAME"]
          pr_num = os.environ["PR_NUMBER"]
          pr_title = os.environ.get("PR_TITLE", "").strip() or f"PR #{pr_num}"
          pr_url = os.environ.get("PR_URL", "").strip() or f"https://github.com/{repo}/pull/{pr_num}"
          run_url = os.environ["RUN_URL"]

          if status != "success":
              color = "#a30200"
              title = f"❌ AI PR Reviewer Failed ({status})"
          elif verdict == "APPROVED":
              color = "#2eb886"
              title = f"🟢 AI PR Review: Approved (PR #{pr_num})"
          else:
              color = "#daa038"
              title = f"🟠 AI PR Review: Changes Suggested (PR #{pr_num})"

          payload = json.dumps({
              "text": f"{title} — {repo} (PR #{pr_num})",
              "attachments": [{
                  "color": color,
                  "blocks": [
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": f"*{title}*\n*Repo:* `{repo}`\n*Workflow:* {wf}\n*PR:* #{pr_num} — {pr_title}"
                          }
                      },
                      {
                          "type": "actions",
                          "elements": [
                              {
                                  "type": "button",
                                  "style": "primary",
                                  "text": {"type": "plain_text", "text": "Open Pull Request"},
                                  "url": pr_url
                              },
                              {
                                  "type": "button",
                                  "text": {"type": "plain_text", "text": "View Action Logs"},
                                  "url": run_url
                              }
                          ]
                      }
                  ]
              }]
          }).encode("utf-8")

          try:
              req = urllib.request.Request(
                  webhook_url,
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print("Slack notification sent:", resp.status)
          except Exception as e:
              print("Slack notification failed (non-blocking):", e)
          EOF
