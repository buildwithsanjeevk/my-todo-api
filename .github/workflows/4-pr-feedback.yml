name: 4. AI PR Feedback & Revision

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: pr-feedback-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply-pr-feedback:
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      !startsWith(github.event.comment.body, '## 🟢') &&
      !startsWith(github.event.comment.body, '## 🟠') &&
      !startsWith(github.event.comment.body, '✅') &&
      !startsWith(github.event.comment.body, '⚠️')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider AI Agent
        run: pip install aider-chat

      - name: Apply PR Review & Owner Feedback (Surgical Diffs)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          OWNER_COMMENT: ${{ github.event.comment.body }}
        run: |
          gh pr checkout "$PR_NUMBER"

          # Extract latest AI review suggestions and recent PR comments
          PR_CONTEXT=$(python3 - << 'EOF'
          import os, json, subprocess

          pr_num = os.environ["PR_NUMBER"]
          res = subprocess.run(
              ["gh", "pr", "view", pr_num, "--json", "title,body,comments"],
              capture_output=True, text=True, check=True
          )
          pr_data = json.loads(res.stdout)
          comments = pr_data.get("comments", [])

          ai_reviews = [
              c["body"] for c in comments
              if "AI Code Review:" in c.get("body", "")
          ]
          latest_review = ai_reviews[-1] if ai_reviews else "No prior AI review found."

          recent_discussion = "\n\n---\n\n".join(
              f"[{c['author']['login']}]: {c['body']}" for c in comments[-5:]
          )

          print(f"PR Title: {pr_data.get('title', '')}\n")
          print(f"=== LATEST AI CODE REVIEW ===\n{latest_review[:6000]}\n")
          print(f"=== RECENT PR COMMENTS ===\n{recent_discussion[:4000]}")
          EOF
          )

          # Resolve and verify fast, active NVIDIA NIM chat/coding models
          NVIDIA_MODELS=$(python3 - << 'EOF'
          import os, sys, json, urllib.request

          api_key = os.environ["NVIDIA_API_KEY"].strip()
          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "GitHub-Actions-PR-Feedback/1.0"
          }

          req = urllib.request.Request("https://integrate.api.nvidia.com/v1/models", headers=headers)
          with urllib.request.urlopen(req, timeout=20) as resp:
              models = json.loads(resp.read().decode("utf-8")).get("data", [])

          available_ids = [m["id"] for m in models if m.get("id")]

          excluded = (
              "starcoder", "codegemma", "embed", "rerank", "guard", "safeguard",
              "reward", "parse", "ocr", "vlm", "vision", "clip", "deplot",
              "kosmos", "neva", "paligemma", "whisper", "tts", "asr", "riva",
              "canary", "parakeet", "vila", "stable-diffusion", "flux", "sdxl",
              "cosyvoice", "bge-", "safety", "shield", "omni", "4-1t", "550b", "ultra"
          )

          priority_keywords = [
              "qwen/qwen2.5-coder-32b-instruct",
              "meta/llama-3.3-70b-instruct",
              "nvidia/llama-3.3-nemotron-super-49b",
              "nvidia/llama-3.1-nemotron-70b-instruct",
              "qwen/qwen2.5-72b-instruct",
              "mistralai/mistral-large-2-instruct",
              "qwen2.5-coder",
              "llama-3.3-70b",
              "nemotron-3.5-bolt",
              "nemotron",
              "qwen/qwen3",
              "deepseek",
          ]

          ordered = []
          for kw in priority_keywords:
              for mid in available_ids:
                  low = mid.lower()
                  if kw in low and not any(x in low for x in excluded) and mid not in ordered:
                      ordered.append(mid)

          for mid in available_ids:
              low = mid.lower()
              if any(tag in low for tag in ("instruct", "chat")) and not any(x in low for x in excluded):
                  if mid not in ordered:
                      ordered.append(mid)

          verified = []
          for mid in ordered[:8]:
              probe_payload = json.dumps({
                  "model": mid,
                  "max_tokens": 1,
                  "messages": [{"role": "user", "content": "hi"}]
              }).encode("utf-8")
              try:
                  probe_req = urllib.request.Request(
                      "https://integrate.api.nvidia.com/v1/chat/completions",
                      data=probe_payload,
                      headers=headers
                  )
                  with urllib.request.urlopen(probe_req, timeout=15) as p_resp:
                      if p_resp.status == 200:
                          verified.append(mid)
                          print(f"Verified NIM model: {mid}", file=sys.stderr)
                          if len(verified) == 3:
                              break
              except Exception as e:
                  print(f"Skipping NIM model {mid}: {e}", file=sys.stderr)

          print("\n".join(verified))
          EOF
          )

          if [ -z "$NVIDIA_MODELS" ]; then
            echo "ERROR: No working NVIDIA NIM chat models resolved."
            exit 1
          fi

          SKILL_ARGS=()
          while IFS= read -r file; do
            SKILL_ARGS+=(--read "$file")
          done < <(find .skills -name 'SKILL.md' 2>/dev/null || true)

          EXISTING_FILES=()
          while IFS= read -r file; do
            EXISTING_FILES+=("$file")
          done < <(find . -maxdepth 3 -type f ! -path './.git/*' ! -path './.github/*' ! -path './.skills/*' ! -path './node_modules/*' ! -name 'package-lock.json' ! -name 'yarn.lock' \( -name '*.js' -o -name '*.ts' -o -name '*.json' -o -name '*.md' -o -name '*.sql' \))

          export PR_CONTEXT OWNER_COMMENT
          python3 - << 'EOF'
          import os

          prompt = f"""You are updating an open Pull Request in this Node.js Express repository.

          Make only the changes needed for the review feedback and owner instruction.
          Preserve existing working code and formatting. Follow loaded SKILL.md rules.

          Owner's Latest Instruction:
          {os.environ["OWNER_COMMENT"]}

          Pull Request & Review Context:
          {os.environ["PR_CONTEXT"]}
          """
          with open("/tmp/aider_feedback_prompt.txt", "w", encoding="utf-8") as prompt_file:
              prompt_file.write(prompt)
          EOF

          PROMPT=$(cat /tmp/aider_feedback_prompt.txt)

          export OPENAI_API_BASE="https://integrate.api.nvidia.com/v1"
          export OPENAI_API_KEY="$NVIDIA_API_KEY"

          for MODEL_ID in $NVIDIA_MODELS; do
            echo "Running Aider feedback revision with NVIDIA model ${MODEL_ID}..."
            if aider \
              --model "openai/${MODEL_ID}" \
              --edit-format diff \
              --yes-always \
              --no-git \
              --no-show-model-warnings \
              --no-suggest-shell-commands \
              --map-tokens 512 \
              "${SKILL_ARGS[@]}" \
              --chat-history-file /tmp/chat_feedback.md \
              --input-history-file /tmp/input_feedback.txt \
              --message "$PROMPT" "${EXISTING_FILES[@]}"; then
              if [ -n "$(git status --porcelain)" ]; then
                break
              fi
            fi
            echo "Model ${MODEL_ID} did not produce changes or hit an API limit, trying next..."
            sleep 2
          done

      - name: Syntax & Runtime Smoke Test
        run: |
          find . -maxdepth 3 -name '*.js' ! -path './node_modules/*' -exec node --check {} +

          TEST_EXIT=0
          if [ -f "package.json" ]; then
            npm install > /tmp/test_log.txt 2>&1 || true
            if grep -q '"test"' package.json && ! grep -q 'no test specified' package.json; then
              npm test >> /tmp/test_log.txt 2>&1 || TEST_EXIT=$?
            fi
            timeout 8s npm start >> /tmp/test_log.txt 2>&1 &
            SERVER_PID=$!
            sleep 3
            curl -i -s http://localhost:3000/todos >> /tmp/test_log.txt 2>&1 || echo "Endpoint check failed" >> /tmp/test_log.txt
            kill $SERVER_PID 2>/dev/null || true
          fi
          cat /tmp/test_log.txt
          rm -rf node_modules
          git checkout -- package-lock.json 2>/dev/null || rm -f package-lock.json
          git checkout -- yarn.lock 2>/dev/null || true
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "ERROR: Automated tests (npm test) failed!"
            exit $TEST_EXIT
          fi

      - name: Push Updates & Re-trigger AI PR Reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            gh pr comment "$PR_NUMBER" --body "⚠️ AI ne PR feedback ke liye koi naya code change generate nahi kiya. Please workflow logs check karein ya specific instructions dein."
            exit 1
          fi

          DIFF_STAT=$(git diff --stat HEAD)

          git add -A
          git commit -m "fix: apply PR review feedback for #${PR_NUMBER}"
          git push origin HEAD

          cat << EOF > /tmp/feedback_reply.md
          ✅ Requested review changes apply kar diye gaye hain aur branch par push ho gaye hain.

          ### 🔍 Updated Files
          \`\`\`text
          ${DIFF_STAT}
          \`\`\`

          🔄 **AI PR Code Reviewer** automatically re-run ho raha hai...
          EOF

          gh pr comment "$PR_NUMBER" --body-file /tmp/feedback_reply.md
          gh workflow run 3-pr-reviewer.yml -f pr_number="$PR_NUMBER" || true

      - name: Send Slack Status Alert
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || 'N/A' }}
          PR_TITLE: ${{ github.event.issue.title || 'No Title' }}
          PR_URL: ${{ github.event.issue.html_url || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set. Skipping Slack notification."
            exit 0
          fi

          python3 - << 'EOF'
          import os, json, urllib.request

          webhook_url = os.environ["SLACK_WEBHOOK_URL"].strip()
          status = os.environ["JOB_STATUS"]
          repo = os.environ["REPO_NAME"]
          wf = os.environ["WORKFLOW_NAME"]
          pr_num = os.environ["PR_NUMBER"]
          pr_title = os.environ["PR_TITLE"]
          pr_url = os.environ["PR_URL"].strip() or f"https://github.com/{repo}/pull/{pr_num}"
          run_url = os.environ["RUN_URL"]

          is_ok = (status == "success")
          color = "#2eb886" if is_ok else "#a30200"
          title = f"✅ PR #{pr_num} Updated with Feedback" if is_ok else f"❌ PR Feedback Revision Failed ({status})"

          payload = json.dumps({
              "text": f"{title} — {repo} (PR #{pr_num})",
              "attachments": [{
                  "color": color,
                  "blocks": [
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": f"*{title}*\n*Repo:* `{repo}`\n*Workflow:* {wf}\n*PR:* #{pr_num} — {pr_title}"
                          }
                      },
                      {
                          "type": "actions",
                          "elements": [
                              {
                                  "type": "button",
                                  "style": "primary",
                                  "text": {"type": "plain_text", "text": "Open Pull Request"},
                                  "url": pr_url
                              },
                              {
                                  "type": "button",
                                  "text": {"type": "plain_text", "text": "View Action Logs"},
                                  "url": run_url
                              }
                          ]
                      }
                  ]
              }]
          }).encode("utf-8")

          try:
              req = urllib.request.Request(
                  webhook_url,
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print("Slack notification sent:", resp.status)
          except Exception as e:
              print("Slack notification failed (non-blocking):", e)
          EOF
