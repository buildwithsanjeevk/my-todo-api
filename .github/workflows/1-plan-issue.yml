name: 1. AI Implementation Planner

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  create-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Post Implementation Plan
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'EOF'
          import os, json, glob, urllib.request

          context_parts = []
          for pattern in ["package.json", "index.js", "README.md", ".skills/**/SKILL.md"]:
              for path in glob.glob(pattern, recursive=True):
                  if os.path.isfile(path):
                      with open(path, "r", encoding="utf-8") as f:
                          context_parts.append(f"--- FILE: {path} ---\n{f.read()}")

          repo_context = "\n\n".join(context_parts) or "Empty repository."

          prompt = f"""You are a Senior Software Architect. A new GitHub Issue has been created.
          Analyze the existing repository files and Skills below, then write a clear, concise Implementation Plan (do NOT write full code files yet).

          Include:
          1. Files to Create/Modify
          2. Step-by-Step Changes (exact routes, status codes, edge cases)
          3. Verification Plan

          Repository Context:
          {repo_context}

          Issue #{os.environ['ISSUE_NUMBER']}: {os.environ['ISSUE_TITLE']}
          Description:
          {os.environ['ISSUE_BODY']}
          """

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps({
                  "model": "openrouter/free",
                  "messages": [{"role": "user", "content": prompt}]
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.loads(resp.read().decode("utf-8"))
              plan = data["choices"][0]["message"]["content"]

          comment_body = f"### 🤖 AI Implementation Plan\n\n{plan}\n\n---\n👉 **Agar ye plan sahi hai, toh is issue par `/approve` comment karein — AI coding aur PR creation shuru kar dega.**"
          with open("/tmp/plan_comment.md", "w", encoding="utf-8") as f:
              f.write(comment_body)
          EOF

          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/plan_comment.md
