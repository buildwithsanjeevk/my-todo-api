name: AI Issue to PR

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider AI Agent
        run: pip install aider-chat

      - name: Generate code with OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          aider --model openrouter/openrouter/free --yes --no-git --no-suggest-shell-commands --chat-history-file /tmp/chat.md --input-history-file /tmp/input.txt --message "You are an expert programmer. Complete the task described in this GitHub Issue by creating or updating the necessary source code files in the repository. Only create actual project files (like package.json, index.js, README.md) and NEVER create files named after terminal commands.

          Issue #$ISSUE_NUMBER: $ISSUE_TITLE
          Details:
          $ISSUE_BODY"
          rm -f .aider* "npm install" "npm start" "PORT=4000 npm start" "]"
          rm -rf "curl http:"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "AI ne koi file change nahi ki."
            exit 1
          fi
          BRANCH="ai-issue-${ISSUE_NUMBER}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: resolve issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          gh pr create --title "AI: ${ISSUE_TITLE}" --body "Closes #${ISSUE_NUMBER}" --base main --head "$BRANCH"
