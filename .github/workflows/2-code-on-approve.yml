name: 2. AI Code & PR on Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: approve-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  code-on-approve:
    if: |
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider AI Agent
        run: pip install aider-chat

      - name: Implement Approved Plan (Surgical & Best Practices)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json comments --jq '[.comments[] | select(.body | contains("AI Implementation Plan")) | .body] | last // ""' > /tmp/approved_plan.txt
          APPROVED_PLAN=$(cat /tmp/approved_plan.txt)

          # Resolve and verify fast, active NVIDIA NIM chat/coding models
          NVIDIA_MODELS=$(python3 - << 'EOF'
          import os, sys, json, urllib.request, urllib.error

          api_key = os.environ["NVIDIA_API_KEY"].strip()
          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "GitHub-Actions-Aider-Coder/1.0"
          }

          req = urllib.request.Request("https://integrate.api.nvidia.com/v1/models", headers=headers)
          with urllib.request.urlopen(req, timeout=20) as resp:
              models = json.loads(resp.read().decode("utf-8")).get("data", [])

          available_ids = [m["id"] for m in models if m.get("id")]

          excluded = (
              "starcoder", "codegemma", "embed", "rerank", "guard", "safeguard",
              "reward", "parse", "ocr", "vlm", "vision", "clip", "deplot",
              "kosmos", "neva", "paligemma", "whisper", "tts", "asr", "riva",
              "canary", "parakeet", "vila", "stable-diffusion", "flux", "sdxl",
              "cosyvoice", "bge-", "safety", "shield", "omni", "4-1t", "550b", "ultra"
          )

          priority_keywords = [
              "qwen/qwen2.5-coder-32b-instruct",
              "meta/llama-3.3-70b-instruct",
              "nvidia/llama-3.3-nemotron-super-49b",
              "nvidia/llama-3.1-nemotron-70b-instruct",
              "qwen/qwen2.5-72b-instruct",
              "mistralai/mistral-large-2-instruct",
              "qwen2.5-coder",
              "llama-3.3-70b",
              "nemotron-3.5-bolt",
              "nemotron",
              "qwen/qwen3",
              "deepseek",
          ]

          ordered = []
          for kw in priority_keywords:
              for mid in available_ids:
                  low = mid.lower()
                  if kw in low and not any(x in low for x in excluded) and mid not in ordered:
                      ordered.append(mid)

          for mid in available_ids:
              low = mid.lower()
              if any(tag in low for tag in ("instruct", "chat")) and not any(x in low for x in excluded):
                  if mid not in ordered:
                      ordered.append(mid)

          # Probe candidates so Aider only receives models active on /chat/completions
          verified = []
          for mid in ordered[:8]:
              probe_payload = json.dumps({
                  "model": mid,
                  "max_tokens": 1,
                  "messages": [{"role": "user", "content": "hi"}]
              }).encode("utf-8")
              try:
                  probe_req = urllib.request.Request(
                      "https://integrate.api.nvidia.com/v1/chat/completions",
                      data=probe_payload,
                      headers=headers
                  )
                  with urllib.request.urlopen(probe_req, timeout=15) as p_resp:
                      if p_resp.status == 200:
                          verified.append(mid)
                          print(f"Verified NIM model: {mid}", file=sys.stderr)
                          if len(verified) == 3:
                              break
              except Exception as e:
                  print(f"Skipping NIM model {mid}: {e}", file=sys.stderr)

          print("\n".join(verified))
          EOF
          )

          if [ -z "$NVIDIA_MODELS" ]; then
            echo "ERROR: No working NVIDIA NIM chat models resolved."
            exit 1
          fi

          SKILL_ARGS=()
          while IFS= read -r file; do
            SKILL_ARGS+=(--read "$file")
          done < <(find .skills -name 'SKILL.md' 2>/dev/null || true)

          EXISTING_FILES=()
          while IFS= read -r file; do
            EXISTING_FILES+=("$file")
          done < <(find . -maxdepth 3 -type f ! -path './.git/*' ! -path './.github/*' ! -path './.skills/*' ! -path './node_modules/*' ! -name 'package-lock.json' ! -name 'yarn.lock' \( -name '*.js' -o -name '*.json' -o -name '*.md' -o -name '*.sql' \))

          export APPROVED_PLAN
          python3 - << 'EOF'
          import os

          prompt = f"""You are implementing an approved GitHub issue in this Node.js Express repository.

          Rules:
          - Make only the changes required by the plan.
          - Preserve existing working code and formatting.
          - Use proper HTTP statuses and {{"error": "message"}} errors.
          - Update tests or documentation only when required.
          - Do not create unrelated files or delete existing files.

          Issue #{os.environ["ISSUE_NUMBER"]}: {os.environ["ISSUE_TITLE"]}
          Requirements:
          {os.environ["ISSUE_BODY"]}

          Approved Implementation Plan:
          {os.environ["APPROVED_PLAN"]}
          """
          with open("/tmp/aider_prompt.txt", "w", encoding="utf-8") as prompt_file:
              prompt_file.write(prompt)
          EOF

          PROMPT=$(cat /tmp/aider_prompt.txt)

          export OPENAI_API_BASE="https://integrate.api.nvidia.com/v1"
          export OPENAI_API_KEY="$NVIDIA_API_KEY"

          for MODEL_ID in $NVIDIA_MODELS; do
            echo "Running Aider with NVIDIA NIM model: ${MODEL_ID}..."
            if aider \
              --model "openai/${MODEL_ID}" \
              --edit-format diff \
              --yes-always \
              --no-git \
              --no-show-model-warnings \
              --no-suggest-shell-commands \
              --map-tokens 1024 \
              "${SKILL_ARGS[@]}" \
              --chat-history-file /tmp/chat1.md \
              --input-history-file /tmp/input1.txt \
              --message "$PROMPT" "${EXISTING_FILES[@]}"; then
              if [ -n "$(git status --porcelain)" ]; then
                break
              fi
            fi
            echo "Model ${MODEL_ID} did not produce changes or hit an API limit, trying next..."
            sleep 2
          done

      - name: Anti-Deletion & Syntax Guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          find . -maxdepth 3 -name '*.js' ! -path './node_modules/*' -exec node --check {} +

          python3 - << 'EOF'
          import subprocess, sys, os

          issue_body = (os.environ.get("ISSUE_BODY") or "").lower()
          allow_delete = any(w in issue_body for w in ["delete", "remove", "replace", "refactor", "clean up"])

          res = subprocess.run(["git", "diff", "--numstat", "HEAD"], capture_output=True, text=True)
          for line in res.stdout.strip().splitlines():
              parts = line.split("\t")
              if len(parts) != 3:
                  continue
              added, deleted, path = parts
              if added == "-" or deleted == "-":
                  continue
              deleted = int(deleted)
              orig_res = subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, text=True)
              orig_lines = len(orig_res.stdout.splitlines())
              if not allow_delete and orig_lines >= 15 and deleted > (orig_lines * 0.4):
                  print(f"ERROR: Too much existing code deleted in {path} ({deleted}/{orig_lines} lines).")
                  sys.exit(1)
          EOF

      - name: Runtime Smoke Test
        run: |
          TEST_EXIT=0
          if [ -f "package.json" ]; then
            npm install > /tmp/test_log.txt 2>&1 || true
            if grep -q '"test"' package.json && ! grep -q 'no test specified' package.json; then
              npm test >> /tmp/test_log.txt 2>&1 || TEST_EXIT=$?
            fi
            timeout 8s npm start >> /tmp/test_log.txt 2>&1 &
            SERVER_PID=$!
            sleep 3
            curl -i -s http://localhost:3000/todos >> /tmp/test_log.txt 2>&1 || echo "Endpoint check failed" >> /tmp/test_log.txt
            kill $SERVER_PID 2>/dev/null || true
          fi
          cat /tmp/test_log.txt
          rm -rf node_modules
          git checkout -- package-lock.json 2>/dev/null || rm -f package-lock.json
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "ERROR: Automated tests (npm test) failed!"
            exit $TEST_EXIT
          fi

      - name: Create Concise, Review-Ready Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ AI ne koi valid code change generate nahi kiya. Please check workflow logs."
            exit 1
          fi

          DIFF_STAT=$(git diff --stat HEAD)
          UNTRACKED=$(git ls-files --others --exclude-standard)

          cat << EOF > /tmp/pr_body.md
          Closes #${ISSUE_NUMBER}

          ### 🔍 Change Summary (Easy Review)
          \`\`\`text
          ${DIFF_STAT}
          \`\`\`
          $([ -n "$UNTRACKED" ] && echo -e "**New Files:**\n\`\`\`text\n${UNTRACKED}\n\`\`\`")

          ### ✅ Automated Checks Passed
          - Surgical diff applied using repository \`.skills/\` & approved implementation plan
          - Existing routes & code preserved (Anti-Deletion Guard passed)
          - JavaScript syntax & runtime smoke test verified
          EOF

          BRANCH="ai-issue-${ISSUE_NUMBER}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: resolve issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --title "AI: ${ISSUE_TITLE}" --body-file /tmp/pr_body.md --base main --head "$BRANCH")
          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
          echo "PR_NUM=$PR_NUM" >> "$GITHUB_ENV"

          gh issue comment "$ISSUE_NUMBER" --body "✅ Surgical code changes taiyar hain aur Pull Request open ho gaya hai: ${PR_URL}"
          gh workflow run 3-pr-reviewer.yml -f pr_number="$PR_NUM" || true

      - name: Send Slack Status Alert
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_NAME: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number || 'N/A' }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'No Title' }}
          ISSUE_URL: ${{ github.event.issue.html_url || '' }}
          PR_URL: ${{ env.PR_URL }}
          PR_NUM: ${{ env.PR_NUM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set. Skipping Slack notification."
            exit 0
          fi

          python3 - << 'EOF'
          import os, json, urllib.request

          webhook_url = os.environ["SLACK_WEBHOOK_URL"].strip()
          status = os.environ["JOB_STATUS"]
          repo = os.environ["REPO_NAME"]
          wf = os.environ["WORKFLOW_NAME"]
          issue_num = os.environ["ISSUE_NUM"]
          issue_title = os.environ["ISSUE_TITLE"]
          issue_url = os.environ["ISSUE_URL"].strip()
          pr_url = os.environ.get("PR_URL", "").strip()
          pr_num = os.environ.get("PR_NUM", "").strip()
          run_url = os.environ["RUN_URL"]

          is_ok = (status == "success")
          color = "#2eb886" if is_ok else "#a30200"
          title = f"✅ PR #{pr_num} Created by AI" if (is_ok and pr_num) else (
              "✅ AI Code & PR Completed" if is_ok else f"❌ AI Coder Failed ({status})"
          )
          preview_target = f"PR #{pr_num}" if pr_num else f"Issue #{issue_num}"

          buttons = []
          if pr_url:
              buttons.append({
                  "type": "button",
                  "style": "primary",
                  "text": {"type": "plain_text", "text": "Open Pull Request"},
                  "url": pr_url
              })
          if issue_url:
              buttons.append({
                  "type": "button",
                  "text": {"type": "plain_text", "text": "Open Issue"},
                  "url": issue_url
              })
          buttons.append({
              "type": "button",
              "text": {"type": "plain_text", "text": "View Action Logs"},
              "url": run_url
          })

          payload = json.dumps({
              "text": f"{title} — {repo} ({preview_target})",
              "attachments": [{
                  "color": color,
                  "blocks": [
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": f"*{title}*\n*Repo:* `{repo}`\n*Workflow:* {wf}\n*Issue:* #{issue_num} — {issue_title}"
                          }
                      },
                      {
                          "type": "actions",
                          "elements": buttons
                      }
                  ]
              }]
          }).encode("utf-8")

          try:
              req = urllib.request.Request(
                  webhook_url,
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print("Slack notification sent:", resp.status)
          except Exception as e:
              print("Slack notification failed (non-blocking):", e)
          EOF
