name: 2. AI Code & PR on Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  code-on-approve:
    if: |
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider AI Agent
        run: pip install aider-chat

      - name: Fetch Approved Plan & Write Code
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          gh issue view "$ISSUE_NUMBER" --comments --json comments --jq '[.comments[] | select(.body | contains("AI Implementation Plan")) | .body] | last // ""' > /tmp/approved_plan.txt
          APPROVED_PLAN=$(cat /tmp/approved_plan.txt)

          SKILL_ARGS=""
          for file in .skills/**/SKILL.md; do
            [ -f "$file" ] && SKILL_ARGS="$SKILL_ARGS --read $file"
          done

          aider --model openrouter/openrouter/free --yes-always --no-git --no-suggest-shell-commands $SKILL_ARGS --chat-history-file /tmp/chat1.md --input-history-file /tmp/input1.txt --message "You are an expert Node.js programmer. Follow all loaded SKILL.md rules strictly and implement the approved plan below with minimal, surgical changes.

          Issue #$ISSUE_NUMBER: $ISSUE_TITLE
          Description:
          $ISSUE_BODY

          Approved Implementation Plan:
          $APPROVED_PLAN"

          find . -maxdepth 2 -type f ! -path './.git/*' ! -path './.github/*' ! -path './.skills/*' ! -name '*.js' ! -name '*.json' ! -name '*.md' ! -name '.gitignore' -delete

      - name: Runtime Smoke Test
        run: |
          if [ -f "package.json" ]; then
            npm install > /tmp/test_log.txt 2>&1 || true
            node --check index.js >> /tmp/test_log.txt 2>&1 || true
            timeout 8s npm start >> /tmp/test_log.txt 2>&1 &
            SERVER_PID=$!
            sleep 3
            curl -i -s http://localhost:3000/todos >> /tmp/test_log.txt 2>&1 || echo "Endpoint check failed" >> /tmp/test_log.txt
            kill $SERVER_PID 2>/dev/null || true
          fi
          cat /tmp/test_log.txt

      - name: Senior AI Review & Auto-Fix
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          SKILL_ARGS=""
          for file in .skills/**/SKILL.md; do
            [ -f "$file" ] && SKILL_ARGS="$SKILL_ARGS --read $file"
          done
          TEST_OUTPUT=$(cat /tmp/test_log.txt)

          aider --model openrouter/openrouter/free --yes-always --no-git --no-suggest-shell-commands $SKILL_ARGS --chat-history-file /tmp/chat2.md --input-history-file /tmp/input2.txt --message "You are a strict Senior Code Reviewer. Verify that the code matches the issue, passes runtime tests, and obeys all SKILL.md rules (minimal changes, preserving existing code). Fix any bugs directly.

          Issue #$ISSUE_NUMBER: $ISSUE_TITLE
          $ISSUE_BODY

          Runtime Logs:
          $TEST_OUTPUT"

          find . -maxdepth 2 -type f ! -path './.git/*' ! -path './.github/*' ! -path './.skills/*' ! -name '*.js' ! -name '*.json' ! -name '*.md' ! -name '.gitignore' -delete
          rm -rf node_modules package-lock.json

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ AI ne koi valid code change generate nahi kiya. Please check logs."
            exit 1
          fi
          BRANCH="ai-issue-${ISSUE_NUMBER}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat: resolve issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --title "AI (Reviewed): ${ISSUE_TITLE}" --body "Closes #${ISSUE_NUMBER} — Built from approved plan using Agent Skills." --base main --head "$BRANCH")
          gh issue comment "$ISSUE_NUMBER" --body "✅ Code likh diya gaya hai aur Pull Request taiyar hai: ${PR_URL}"
